<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>calc</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e3;
    --dim: #6b6b64;
    --accent: #7fdc7f;
    --wrong: #3a2a2a;
    --panel: #111110;
    --border: #232320;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f4f0;
      --fg: #16160f;
      --dim: #8a8a7f;
      --accent: #2f8f2f;
      --wrong: #f0dcdc;
      --panel: #eaeae4;
      --border: #d8d8ce;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --fg: #e8e8e3;
    --dim: #6b6b64;
    --accent: #7fdc7f;
    --wrong: #3a2a2a;
    --panel: #111110;
    --border: #232320;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "SF Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 480px;
  }

  .score {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top,0px));
    left: 24px;
    font-size: 13px;
    color: var(--dim);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .gear {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top,0px));
    right: 16px;
    background: none;
    border: none;
    color: var(--dim);
    font-size: 18px;
    cursor: pointer;
    padding: 8px;
    line-height: 1;
    transition: color 0.15s;
  }
  .gear:hover { color: var(--fg); }

  .expr {
    font-size: clamp(40px, 11vw, 68px);
    font-weight: 500;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    user-select: none;
    transition: transform 0.12s ease;
  }
  .expr.pulse { transform: scale(1.06); }

  input#answer {
    width: 220px;
    max-width: 70vw;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--border);
    color: var(--accent);
    font-family: inherit;
    font-size: 32px;
    text-align: center;
    padding: 6px 0 10px;
    outline: none;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.15s;
    caret-color: var(--accent);
  }
  input#answer:focus { border-color: var(--accent); }

  .streak {
    font-size: 12px;
    color: var(--dim);
    min-height: 14px;
  }

  /* settings panel */
  .panel {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .panel.open {
    opacity: 1;
    pointer-events: auto;
  }
  .panel-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    width: 100%;
    max-width: 340px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 18px;
  }
  .op-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .op-row .op-label {
    width: 18px;
    font-size: 18px;
    color: var(--fg);
    flex-shrink: 0;
  }
  .op-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .op-row input[type="number"] {
    width: 100%;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 4px;
    -moz-appearance: textfield;
  }
  .op-row input[type="number"]::-webkit-outer-spin-button,
  .op-row input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .op-row .dash { color: var(--dim); font-size: 12px; flex-shrink: 0; }
  .op-row.disabled input[type="number"] { opacity: 0.35; }

  .panel-close {
    width: 100%;
    margin-top: 6px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .hint {
    font-size: 11px;
    color: var(--dim);
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="score" id="score">0</div>
<button class="gear" id="gearBtn" aria-label="settings">⚙</button>

<div class="stage">
  <div class="expr" id="expr">–</div>
  <div>
    <input id="answer" type="text" inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="">
    <div class="streak" id="streak"></div>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-card">
    <div class="panel-title">operand ranges</div>
    <div id="opRows"></div>
    <div class="hint">unchecking an operator removes it from the mix. division always yields a whole number.</div>
    <button class="panel-close" id="closeBtn">done</button>
  </div>
</div>

<script>
(function(){
  var STORE_KEY = 'calc-game-settings-v1';

  var defaults = {
    '+': { on: true, min: 1, max: 50 },
    '-': { on: true, min: 1, max: 50 },
    '*': { on: true, min: 2, max: 12 },
    '/': { on: true, min: 2, max: 12 }
  };

  var settings = loadSettings();

  function loadSettings(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(defaults));
      var parsed = JSON.parse(raw);
      var merged = {};
      Object.keys(defaults).forEach(function(k){
        merged[k] = Object.assign({}, defaults[k], parsed[k] || {});
      });
      return merged;
    } catch(e) {
      return JSON.parse(JSON.stringify(defaults));
    }
  }

  function saveSettings(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch(e) {}
  }

  var exprEl = document.getElementById('expr');
  var inputEl = document.getElementById('answer');
  var scoreEl = document.getElementById('score');
  var streakEl = document.getElementById('streak');
  var panelEl = document.getElementById('panel');
  var gearBtn = document.getElementById('gearBtn');
  var closeBtn = document.getElementById('closeBtn');
  var opRows = document.getElementById('opRows');

  var score = 0;
  var streak = 0;
  var currentAnswer = null;

  var symbolLabel = { '+':'+', '-':'−', '*':'×', '/':'÷' };

  function randInt(min, max){
    min = Math.ceil(min);
    max = Math.floor(max);
    if (max < min) max = min;
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function activeOps(){
    return Object.keys(settings).filter(function(k){ return settings[k].on; });
  }

  function nextExpression(){
    var ops = activeOps();
    if (ops.length === 0){
      exprEl.textContent = 'pick an operator';
      currentAnswer = null;
      return;
    }
    var op = ops[randInt(0, ops.length - 1)];
    var cfg = settings[op];
    var a, b, answer, text;

    if (op === '+'){
      a = randInt(cfg.min, cfg.max);
      b = randInt(cfg.min, cfg.max);
      answer = a + b;
      text = a + ' + ' + b;
    } else if (op === '-'){
      a = randInt(cfg.min, cfg.max);
      b = randInt(cfg.min, cfg.max);
      if (b > a) { var t = a; a = b; b = t; }
      answer = a - b;
      text = a + ' \u2212 ' + b;
    } else if (op === '*'){
      a = randInt(cfg.min, cfg.max);
      b = randInt(cfg.min, cfg.max);
      answer = a * b;
      text = a + ' \u00d7 ' + b;
    } else if (op === '/'){
      var divisor = randInt(Math.max(1, cfg.min), Math.max(1, cfg.max));
      var quotient = randInt(cfg.min, cfg.max);
      a = divisor * quotient;
      b = divisor;
      answer = quotient;
      text = a + ' \u00f7 ' + b;
    }

    currentAnswer = answer;
    exprEl.textContent = text;
  }

  function pulse(){
    exprEl.classList.remove('pulse');
    void exprEl.offsetWidth;
    exprEl.classList.add('pulse');
  }

  function checkInput(){
    var raw = inputEl.value.trim();
    if (raw === '' || raw === '-') return;
    var val = Number(raw);
    if (Number.isNaN(val)) return;
    if (currentAnswer !== null && val === currentAnswer){
      score += 1;
      streak += 1;
      scoreEl.textContent = String(score);
      streakEl.textContent = streak > 2 ? (streak + ' in a row') : '';
      pulse();
      inputEl.value = '';
      nextExpression();
    }
  }

  inputEl.addEventListener('input', checkInput);

  // settings panel
  function buildRows(){
    opRows.innerHTML = '';
    ['+','-','*','/'].forEach(function(op){
      var cfg = settings[op];
      var row = document.createElement('div');
      row.className = 'op-row' + (cfg.on ? '' : ' disabled');

      var check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = cfg.on;
      check.addEventListener('change', function(){
        cfg.on = check.checked;
        row.className = 'op-row' + (cfg.on ? '' : ' disabled');
        saveSettings();
      });

      var label = document.createElement('span');
      label.className = 'op-label';
      label.textContent = symbolLabel[op];

      var minInput = document.createElement('input');
      minInput.type = 'number';
      minInput.value = cfg.min;
      minInput.min = '0';
      minInput.addEventListener('change', function(){
        var v = parseInt(minInput.value, 10);
        cfg.min = Number.isNaN(v) ? cfg.min : v;
        if (cfg.min > cfg.max) cfg.max = cfg.min;
        maxInput.value = cfg.max;
        saveSettings();
      });

      var dash = document.createElement('span');
      dash.className = 'dash';
      dash.textContent = 'to';

      var maxInput = document.createElement('input');
      maxInput.type = 'number';
      maxInput.value = cfg.max;
      maxInput.min = '0';
      maxInput.addEventListener('change', function(){
        var v = parseInt(maxInput.value, 10);
        cfg.max = Number.isNaN(v) ? cfg.max : v;
        if (cfg.max < cfg.min) cfg.min = cfg.max;
        minInput.value = cfg.min;
        saveSettings();
      });

      row.appendChild(check);
      row.appendChild(label);
      row.appendChild(minInput);
      row.appendChild(dash);
      row.appendChild(maxInput);
      opRows.appendChild(row);
    });
  }

  function openPanel(){
    buildRows();
    panelEl.classList.add('open');
  }
  function closePanel(){
    panelEl.classList.remove('open');
    nextExpression();
    inputEl.value = '';
    inputEl.focus();
  }

  gearBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  panelEl.addEventListener('click', function(e){
    if (e.target === panelEl) closePanel();
  });

  nextExpression();
  inputEl.focus();
})();
</script>
</body>
</html>
